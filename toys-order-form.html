<!DOCTYPE html>
<html>
<body>
<h1>TOYS ORDER FORM</h1>

<form action = "toys.html">
    <label for = "Buyer">Buyer's Name :</label><br>
    <input type = "text" id = "Buyer"><br>

    <label for = "Address">Address :</label><br>
    <input type = "text" id = "Address"><br>

    <label for = "Phone">Phone Number :</label><br>
    <input type = "text" id = "Phone"><br>

    <h2> TOYS ITEMS </h2>

    <input type="checkbox" id="Product1" name="Product" value="Action Figure">
    <label for="Product1"> ACTION FIGURE</label><br>

    <input type="checkbox" id="Product2" name="Product" value="Doll">
    <label for="Product2"> DOLL</label><br>

    <input type="checkbox" id="Product3" name="Product" value="Lego Blocks">
    <label for="Product3"> LEGO BLOCKS</label><br>

    <input type="checkbox" id="Product4" name="Product" value="Video Game">
    <label for="Product4"> VIDEO GAME</label><br>

    <input type="checkbox" id="Product5" name="Product" value="Board Game">
    <label for="Product5"> BOARD GAME</label><br>

    <input type="checkbox" id="Product6" name="Product" value="Puzzle">
    <label for="Product6"> PUZZLE</label><br>

    <input type="checkbox" id="Product7" name="Product" value="Remote Control Car">
    <label for="Product7"> RC CAR</label><br>

    <h3> PAYMENT MODE </h3>

    <input type="radio" id="Cash" name="Payment" value="CASH">
    <label for="Cash">CASH</label><br>

    <input type="radio" id="Online" name="Payment" value="ONLINE">
    <label for="Online">ONLINE</label><br>

    <input type="radio" id="Card" name="Payment" value="CARD">
    <label for="Card">CARD</label><br>

    <input type="submit" value="Submit">
</form>

</body>
</html>
